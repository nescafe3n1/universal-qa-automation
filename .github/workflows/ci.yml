name: tests

# Runs on every push and pull request. Three jobs:
#   fast     - the quick tests (no browser) on Windows and Linux, oldest and newest supported Python
#   browser  - the end-to-end tests: scans a local test website, writes tests, runs them, breaks the site on purpose
#   package  - builds the package, installs it into a clean environment and checks the commands work

on:
  push:
  pull_request:

jobs:
  fast:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - run: python -m pytest -m "not integration"

  browser:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Install Chromium
        run: playwright install --with-deps chromium
      - run: python -m pytest -m integration

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Install the built package into a clean environment and try the commands
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/nes-qa --version
          /tmp/clean/bin/run-playwright --version
          cd /tmp   # leave the checkout, or Python imports the source folder instead of the installed package
          /tmp/clean/bin/python -c "import pathlib, qa_generator; root = pathlib.Path(qa_generator.__file__).parent; assert (root / 'legal' / 'TERMS_OF_USE.md').exists() and (root / 'templates' / 'conftest.py').exists() and (root / 'templates' / 'axe.min.js').exists() and not (root / 'server').exists()"
